<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stavrons Master-Bot</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --panel-bg: #151a25;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .welcome-box {
            width: 100%;
            max-width: 1000px;
            margin-bottom: 30px;
        }

        .welcome-box h1 { font-size: 32px; margin: 0 0 5px 0; font-weight: 300; }
        .welcome-box h1 strong { color: var(--accent-blue); font-weight: 700; }
        .welcome-box p { color: var(--text-muted); font-size: 16px; margin: 0; }

        .dashboard-container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid #2d3748;
        }

        .card-title { color: var(--text-muted); font-size: 12px; text-transform: uppercase; margin-bottom: 10px; }
        .card-value { font-size: 32px; font-weight: bold; margin: 0; }
        
        .chart-container {
            width: 100%;
            max-width: 1000px;
            height: 500px;
            background-color: var(--panel-bg);
            border-radius: 12px;
            border: 1px solid #2d3748;
            overflow: hidden;
        }

        .footer { margin-top: 40px; color: var(--text-muted); font-size: 12px; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="welcome-box">
        <h1>Hallo, <strong>Stavron</strong>.</h1>
        <p>Master-Bot Überwachungszentrale</p>
    </div>

    <div class="dashboard-container">
        <div class="card">
            <div class="card-title">Live-Kapital</div>
            <div class="card-value">200.00 €</div>
        </div>
        <div class="card">
            <div class="card-title">Risiko-Einstellung</div>
            <div class="card-value" style="color: var(--accent-blue);">Niedrig</div>
        </div>
        <div class="card">
            <div class="card-title">Markt-Scanner</div>
            <div class="card-value" style="font-size: 20px; color: var(--accent-green);">Aktiv (Top 100)</div>
        </div>
    </div>

    <!-- HIER IST DER LIVE-CHART MIT KERZEN -->
    <div class="chart-container">
        <!-- TradingView Widget BEGIN -->
        <div class="tradingview-widget-container">
          <div id="tradingview_12345" style="height: 100%; width: 100%;"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
          <script type="text/javascript">
          new TradingView.widget(
          {
          "autosize": true,
          "symbol": "BINANCE:BTCUSDT",
          "interval": "15",
          "timezone": "Europe/Berlin",
          "theme": "dark",
          "style": "1",
          "locale": "de_DE",
          "enable_publishing": false,
          "backgroundColor": "#151a25",
          "gridColor": "#2d3748",
          "hide_top_toolbar": false,
          "hide_legend": false,
          "save_image": false,
          "container_id": "tradingview_12345"
        }
          );
          </script>
        </div>
        <!-- TradingView Widget END -->
    </div>

    <div class="footer">
        POWERED BY STAVRON 
    </div>

</body>
</html>
